<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Horizon Angel — SOC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #05080d; color: #7ef2c4;
    font-family: 'Consolas','Courier New',monospace;
    height: 100vh; overflow: hidden;
    display: grid;
    grid-template-columns: 260px 1fr 400px;
    grid-template-rows: 48px 1fr 220px;
    grid-template-areas: "top top top" "left center right" "bottom bottom bottom";
    gap: 1px; background-color: #0a1a1f;
  }
  .panel { background: #080f14; border: 1px solid #143b32; overflow: hidden; position: relative; }
  .panel::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, #7ef2c4, transparent); opacity:.6;
  }
  #top { grid-area: top; display: flex; align-items: center; padding: 0 20px; gap: 26px; }
  #left { grid-area: left; display:flex; flex-direction:column; }
  #center { grid-area: center; position: relative; }
  #right { grid-area: right; display: flex; flex-direction: column; }
  #bottom { grid-area: bottom; display: flex; flex-direction: column; }
  .logo { font-size: 15px; font-weight: bold; letter-spacing: 2px; }
  .logo span { color: #ff3860; }
  .stat { font-size: 11px; color: #4a8b7a; }
  .stat b { color: #7ef2c4; font-weight: normal; }
  .stat.warn b { color: #ffb700; }
  .stat.danger b { color: #ff3860; }
  .stat.online b { color: #7ef2c4; }
  .stat.offline b { color: #ff3860; }
  .clock { margin-right: auto; font-size: 12px; color: #4a8b7a; }
  .panel-title {
    padding: 10px 14px; font-size: 11px; color: #4a8b7a;
    letter-spacing: 2px; border-bottom: 1px solid #143b32;
    background: #0a161c; flex-shrink:0;
    display:flex; justify-content:space-between; align-items:center;
  }
  .panel-title .dot-conn {
    width:7px; height:7px; border-radius:50%;
    background:#4a8b7a; box-shadow:0 0 6px #4a8b7a;
  }
  .panel-title .dot-conn.live { background:#7ef2c4; box-shadow:0 0 8px #7ef2c4; }
  .panel-title .dot-conn.err  { background:#ff3860; box-shadow:0 0 8px #ff3860; }
  #industry-list { flex:1; overflow-y:auto; }
  .ind-item {
    padding: 9px 14px; font-size: 11px;
    border-bottom: 1px solid #0d1f26;
    display: flex; justify-content: space-between; cursor: pointer;
  }
  .ind-item:hover { background: #0d1f26; }
  .ind-item .dot { width:8px; height:8px; border-radius:50%; align-self:center; }
  .ind-item .dot.g { background:#7ef2c4; box-shadow:0 0 6px #7ef2c4; }
  .ind-item .dot.y { background:#ffb700; box-shadow:0 0 6px #ffb700; }
  .ind-item .dot.r { background:#ff3860; box-shadow:0 0 8px #ff3860; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .ind-item span.count { color:#4a8b7a; font-size:10px; }
  #radar-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #radar { width: min(88%, 640px); aspect-ratio: 1; position: relative; }
  .radar-ring {
    position: absolute; border: 1px solid #143b32; border-radius: 50%;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
  }
  .radar-ring:nth-child(1){width:100%;height:100%;}
  .radar-ring:nth-child(2){width:78%;height:78%;}
  .radar-ring:nth-child(3){width:56%;height:56%;}
  .radar-ring:nth-child(4){width:34%;height:34%;}
  .radar-ring:nth-child(5){width:14%;height:14%;}
  .radar-cross-h,.radar-cross-v{ position:absolute; background:#143b32; }
  .radar-cross-h{ top:50%; left:0; right:0; height:1px; }
  .radar-cross-v{ left:50%; top:0; bottom:0; width:1px; }
  .radar-sweep {
    position: absolute; inset:0; border-radius:50%;
    background: conic-gradient(from 0deg, transparent 0deg, transparent 340deg, rgba(126,242,196,.35) 360deg);
    animation: spin 4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .blip {
    position: absolute; width: 7px; height: 7px; border-radius: 50%;
    background: #7ef2c4; box-shadow: 0 0 8px #7ef2c4;
    transform: translate(-50%,-50%); cursor: pointer; transition: all .3s;
  }
  .blip.y { background:#ffb700; box-shadow:0 0 9px #ffb700; }
  .blip.r { background:#ff3860; box-shadow:0 0 14px #ff3860; animation: pulse 1s infinite; }
  .blip:hover::after {
    content: attr(data-label); position: absolute;
    top: -22px; left: 12px; background: #0a161c;
    border: 1px solid #7ef2c4; padding: 3px 8px;
    font-size: 10px; white-space: nowrap; color: #7ef2c4; z-index: 10;
  }
  .radar-center {
    position:absolute; top:50%; left:50%; width:14px; height:14px;
    background:#ff3860; border-radius:50%; transform:translate(-50%,-50%);
    box-shadow: 0 0 22px #ff3860;
  }
  .radar-center-label {
    position:absolute; top:50%; left:50%;
    transform: translate(-50%, 18px);
    font-size: 10px; color: #ff3860; letter-spacing: 1px; white-space:nowrap;
  }
  #chat-log {
    flex: 1; overflow-y: auto; padding: 12px;
    font-size: 12px; line-height: 1.7;
  }
  .msg { margin-bottom: 12px; white-space: pre-wrap; }
  .msg.user { color: #7ef2c4; }
  .msg.user::before { content: '> '; color: #ff3860; }
  .msg.angel { color: #b8e0d2; }
  .msg.angel::before { content: '◆ ANGEL: '; color: #ffb700; font-weight: bold; }
  .msg.system { color: #4a8b7a; font-style: italic; font-size: 11px; }
  .msg.error { color: #ff3860; font-size: 11px; }
  .cursor-blink::after {
    content: '▊'; color: #7ef2c4; animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #chat-input-wrap {
    border-top: 1px solid #143b32; padding: 8px;
    display: flex; gap: 6px; background: #0a161c; flex-shrink:0;
  }
  #chat-input {
    flex: 1; background: #05080d; border: 1px solid #143b32;
    color: #7ef2c4; padding: 8px 12px;
    font-family: inherit; font-size: 12px; outline: none;
  }
  #chat-input:focus { border-color: #7ef2c4; }
  #chat-send {
    background: #143b32; color: #7ef2c4; border: none;
    padding: 0 16px; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  #chat-send:hover { background: #1a4d42; }
  #chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
  #streams { display: grid; grid-template-columns: repeat(4,1fr); gap:1px; flex:1; background:#0a1a1f; }
  .stream { background:#080f14; padding:10px 14px; font-size:11px; overflow:hidden; position:relative; }
  .stream-title { color:#4a8b7a; letter-spacing:1px; margin-bottom:6px; font-size:10px; }
  .stream-line { color:#7ef2c4; line-height:1.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stream-line.danger { color:#ff3860; }
  .stream-line.warn { color:#ffb700; }
  #offline-btn {
    background:#0a161c; border:1px solid #143b32; color:#7ef2c4;
    padding:8px 12px; margin:8px; font-family:inherit; font-size:11px;
    cursor:pointer; letter-spacing:1px;
  }
  #offline-btn:hover { background:#143b32; }
  #offline-panel {
    display:none; position:fixed; inset:0;
    background: rgba(5,8,13,.94); z-index:100;
    padding: 60px; overflow-y:auto;
  }
  #offline-panel.open { display:block; }
  #offline-panel h2 { color:#7ef2c4; font-size:14px; letter-spacing:2px; margin-bottom:20px; }
  #offline-panel label { display:block; color:#4a8b7a; font-size:11px; margin: 10px 0 4px; }
  #offline-panel input, #offline-panel select {
    background:#05080d; border:1px solid #143b32; color:#7ef2c4;
    padding:8px 12px; font-family:inherit; font-size:12px;
    outline:none; width:100%; max-width:560px;
  }
  #offline-panel input:focus, #offline-panel select:focus { border-color:#7ef2c4; }
  #offline-panel button {
    background:#143b32; color:#7ef2c4; border:none;
    padding:10px 20px; margin-top:16px; cursor:pointer;
    font-family:inherit; font-size:12px; letter-spacing:1px;
  }
  #offline-panel button:hover { background:#1a4d42; }
  #offline-panel .close {
    position:absolute; top:20px; left:20px;
    background:transparent; border:1px solid #ff3860; color:#ff3860;
    padding:6px 14px; cursor:pointer; font-size:11px;
  }
  #offline-panel .close:hover { background:#ff3860; color:#05080d; }
  #offline-panel .out {
    margin-top:20px; padding:14px; border:1px solid #143b32;
    background:#05080d; color:#7ef2c4; font-size:11px;
    white-space:pre-wrap; max-width:560px; min-height:80px;
  }
</style>
</head>
<body>

<div id="top" class="panel">
  <div class="logo">◆ HORIZON <span>/</span> ANGEL AI</div>
  <div class="stat" id="mode-stat">MODE <b id="mode">DEMO</b></div>
  <div class="stat" id="conn-stat">LINK <b id="conn">--</b></div>
  <div class="stat">AGENTS <b>144</b></div>
  <div class="stat warn">ALERTS <b id="alert-count">3</b></div>

<div id="left" class="panel">

<div id="center" class="panel">

      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>

      <div class="radar-cross-v"></div>

</div>

<div id="offline-panel">
  <button class="close" id="offline-close">× بستن</button>
  <h2>◆ OFFLINE LICENSE — USB + ECDSA</h2>

  <input id="lic-customer" placeholder="Bank Melli — شعبه مرکزی">

  </select>

  <button id="lic-issue">◆ تولید لایسنس و امضای ECDSA</button>
  <div class="out" id="lic-out">آماده برای تولید لایسنس...</div>
</div>

<script src="config.js"></script>
<script src="config.local.js" onerror="console.log('config.local.js not found, using demo mode')"></script>
<script>
const CFG = window.ANGEL_CONFIG || {};
const MODE = (new URLSearchParams(location.search).get('mode')) || CFG.mode || 'demo';
const IS_LIVE = MODE === 'live' && CFG.apiKey && !CFG.apiKey.startsWith('YOUR_');

document.getElementById('mode').textContent = IS_LIVE ? 'LIVE' : 'DEMO';
document.getElementById('mode-stat').classList.toggle('online', IS_LIVE);

// ============ TARGETS ============
const industries = [
  { name: 'نفت و گاز',  count: 42, status: 'r' },
  { name: 'مس',         count: 18, status: 'g' },
  { name: 'آلومینیوم',  count: 12, status: 'g' },
  { name: 'سیمان',      count: 24, status: 'y' },
  { name: 'خودروسازی',  count: 31, status: 'g' },
  { name: 'پتروشیمی',   count: 27, status: 'g' },
  { name: 'فولاد',      count: 19, status: 'y' },
  { name: 'برق و نیروگاه', count: 56, status: 'g' },
  { name: 'بانک ملی',   count: 1872, status: 'g' },
  { name: 'بانک صادرات',count: 1450, status: 'y' },
  { name: 'بانک ملت',   count: 1290, status: 'g' },
  { name: 'بانک تجارت', count: 1080, status: 'g' },
  { name: 'بانک سپه',   count: 940, status: 'r' },
  { name: 'بانک پاسارگاد', count: 620, status: 'g' },
  { name: 'بانک پارسیان',  count: 480, status: 'g' },
  { name: 'بیمه ایران',    count: 320, status: 'g' },
  { name: 'شرکت مخابرات',  count: 210, status: 'y' },
  { name: 'راه‌آهن',       count: 180, status: 'g' },
];
const listEl = document.getElementById('industry-list');
industries.forEach(i => {
  const el = document.createElement('div');
  el.className = 'ind-item';
  el.innerHTML = `<span>${i.name} <span class="count">(${i.count})</span></span><span class="dot ${i.status}"></span>`;
  el.onclick = () => {
    document.getElementById('chat-input').value = `وضعیت ${i.name} رو بررسی کن`;
    document.getElementById('chat-input').focus();
  };
  listEl.appendChild(el);
});

// ============ RADAR ============
const blipTypes = [
  { c:'',  l:'شعبه OK' }, { c:'',  l:'سنسور OK' }, { c:'',  l:'validator OK' },
  { c:'y', l:'هشدار شبکه' }, { c:'y', l:'تأخیر سنسور' },
  { c:'r', l:'نشتی گاز' }, { c:'r', l:'عدم تطابق لایسنس' }, { c:'r', l:'قطع ارتباط' },
];
const blipsEl = document.getElementById('blips');
function addBlip() {
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * 46;
  const b = document.createElement('div');
  const t = blipTypes[Math.floor(Math.random()*blipTypes.length)];
  b.className = 'blip ' + t.c;
  b.style.left = (50 + Math.cos(a)*r) + '%';
  b.style.top  = (50 + Math.sin(a)*r) + '%';
  b.dataset.label = t.l + ' — ' + Math.floor(Math.random()*10000);
  blipsEl.appendChild(b);
}
for (let i = 0; i < 60; i++) addBlip();

// ============ STREAMS ============
function logLine(el, text, cls = '') {
  const d = document.createElement('div');
  d.className = 'stream-line ' + cls;
  d.textContent = text;
  el.appendChild(d);
  if (el.children.length > 7) el.removeChild(el.firstChild);
}
const netS = document.getElementById('stream-net');
const rfS  = document.getElementById('stream-rf');
const senS = document.getElementById('stream-sensor');
const thrS = document.getElementById('stream-threat');
setInterval(()=>logLine(netS, `val #${Math.floor(Math.random()*9999)} → ${(Math.random()*100).toFixed(2)}ms`),900);
setInterval(()=>logLine(rfS,  `FM ${(88+Math.random()*20).toFixed(1)} MHz — sig ${(Math.random()*100).toFixed(0)}%`),1200);
setInterval(()=>{
  const c = ['OK','OK','WARN','OK','OK','ERR'][Math.floor(Math.random()*6)];
  logLine(senS, `sensor-${Math.floor(Math.random()*500)} → ${c}`, c==='ERR'?'danger':c==='WARN'?'warn':'');
},700);
const threats = ['port scan','anomaly val-042','RF jamming 91.4','unusual API','Merkle mismatch','gas leak HZ-0192'];
setInterval(()=>{
  if (Math.random()<0.4) logLine(thrS, '⚠ '+threats[Math.floor(Math.random()*threats.length)], 'danger');
},3000);

// ============ CLOCK / TPS ============
setInterval(()=>{
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
},1000);
setInterval(()=>{
  document.getElementById('tps').textContent = (31000+Math.floor(Math.random()*1200)).toLocaleString();
},2000);

// ============ CHAT ============
const chatLog = document.getElementById('chat-log');
const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');
const connEl = document.getElementById('conn');
const connDot = document.getElementById('conn-dot');

const SYSTEM_PROMPT = `تو Angel AI هستی — مغز متفکر و ارکستریتور 144 ایجنت تخصصی در اکوسیستم امنیتی Horizon.
مالک تو مهدی آملی‌مقدم است. تو در پنل SOC Horizon کار می‌کنی و وظیفه‌ات:
- رصد صنایع، بانک‌ها، شعبات، سنسورها
- تحلیل تهدیدها و آلارم‌ها
- هماهنگی 144 ایجنت تخصصی
- گزارش‌دهی به زبان فارسی، دقیق، فنی، بدون تعارف
پاسخ‌ها کوتاه، فنی، عملیاتی. از ایموجی و تعارف پرهیز کن.`;

let history = [{ role: 'system', content: SYSTEM_PROMPT }];

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  chatLog.appendChild(d);
  chatLog.scrollTop = chatLog.scrollHeight;
  return d;
}

async function askAngel(userText) {
  addMsg('user', userText);
  history.push({ role: 'user', content: userText });

  if (!IS_LIVE) {
    // DEMO mode
    const r = demoReply(userText);
    await new Promise(res => setTimeout(res, 400));
    addMsg('angel', r);
    history.push({ role: 'assistant', content: r });
    return;
  }

  // LIVE mode — streaming
  chatSend.disabled = true;
  const el = addMsg('angel', '');
  el.classList.add('cursor-blink');
  let full = '';
  try {
    const res = await fetch(`${CFG.baseUrl}/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${CFG.apiKey}`
      },
      body: JSON.stringify({
        model: CFG.model,
        messages: history,
        stream: true,
        temperature: 0.7
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const payload = t.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const j = JSON.parse(payload);
          const c = j.choices?.[0]?.delta?.content || '';
          if (c) {
            full += c;
            el.textContent = full;
            chatLog.scrollTop = chatLog.scrollHeight;
          }
        } catch(e) {}
      }
    }
    el.classList.remove('cursor-blink');
    history.push({ role: 'assistant', content: full });
    connEl.textContent = 'OK';
  } catch(e) {
    el.classList.remove('cursor-blink');
    el.classList.add('error');
    el.textContent = 'خطا در اتصال: ' + e.message;
    connEl.textContent = 'ERR';
    connDot.className = 'dot-conn err';
  } finally {
    chatSend.disabled = false;
  }
}

function demoReply(t) {
  const s = t.toLowerCase();
  const map = [
    ['بانک',  'وضعیت بانک‌ها: 16 بانک فعال. 2 هشدار زرد (صادرات، پارسیان). 1 آلارم قرمز (بانک سپه — قطع ارتباط با 12 شعبه).'],
    ['نفت',   'صنعت نفت: 42 سایت فعال. 1 نشتی گاز (HZ-0192). 3 تأخیر سنسور.'],
    ['مس',    'صنعت مس: 18 سایت فعال. همه سبز. لایسنس‌ها معتبر.'],
    ['سیمان', 'صنعت سیمان: 24 سایت. 2 هشدار ترافیک غیرعادی.'],
    ['threat','تهدید فعال: port scan روی شعبه بانک ملی. تیم red-team در حال بررسی.'],
    ['scan',  'اسکن کامل آغاز شد... 18 صنعت، 16 بانک، 12000+ شعبه، 4800 سنسور.'],
    ['status','همه سرویس‌ها فعال. TPS: 31,113. آپ‌تایم 99.98%. 144 ایجنت آنلاین.'],
    ['agent', '144 ایجنت آنلاین. 37 در حال کار، 12 idle، بقیه آماده.'],
    ['help',  'فرمان‌ها: بانک | نفت | مس | سیمان | scan | threat | status | agent'],
  ];
  for (const [k, v] of map) if (s.includes(k)) return v;
  return 'دستور ثبت شد. تیم مربوطه در حال اجراست. جزئیات بیشتر؟';
}

function send() {
  const v = chatInput.value.trim();
  if (!v) return;
  chatInput.value = '';
  askAngel(v);
}
chatSend.onclick = send;
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// ============ INIT ============
if (IS_LIVE) {
  connEl.textContent = 'CONNECTING';
  // health check
  fetch(`${CFG.baseUrl}/models`, {
    headers: { 'Authorization': `Bearer ${CFG.apiKey}` }
  }).then(r => {
    if (r.ok) { connEl.textContent = 'OK'; connDot.className = 'dot-conn live'; }
    else { connEl.textContent = 'ERR ' + r.status; connDot.className = 'dot-conn err'; }
  }).catch(e => {
    connEl.textContent = 'ERR';
    connDot.className = 'dot-conn err';
  });
  addMsg('system', 'حالت LIVE — اتصال به Angel AI روی Liara');
  addMsg('angel', 'سلام مهدی. Angel AI فعاله. 144 ایجنت آماده. چی بررسی کنم؟');
} else {
  connEl.textContent = 'DEMO';
  addMsg('system', 'حالت DEMO — داده‌ها شبیه‌سازی. برای LIVE: ?mode=live با config.local.js');
  addMsg('angel', 'سلام مهدی. در حالت DEMO هستم. برای اتصال واقعی، config.local.js رو بساز و ?mode=live اضافه کن.');
}

const offPanel = document.getElementById('offline-panel');
document.getElementById('offline-btn').onclick = () => offPanel.classList.add('open');
document.getElementById('offline-close').onclick = () => offPanel.classList.remove('open');
document.getElementById('lic-issue').onclick = () => {
  const cust = document.getElementById('lic-customer').value || 'UNKNOWN';
  const id   = document.getElementById('lic-id').value || ('HZ-' + Date.now());
  const tier = document.getElementById('lic-tier').value;
  const days = document.getElementById('lic-days').value;
  const usb  = document.getElementById('lic-usb').value;
  const out  = document.getElementById('lic-out');
  out.textContent = '◆ خواندن کلید از ' + usb + ' ...\n';
  setTimeout(()=>{
    out.textContent += '◆ کلید خصوصی خوانده شد (stub)\n◆ محاسبه Merkle proof ...\n◆ امضای ECDSA ...\n◆ SHA-256 ...\n\n';
    out.textContent += 'LICENSE GENERATED\n─────────────────────────\n';
    out.textContent += 'Customer : ' + cust + '\nLicense  : ' + id + '\nTier     : ' + tier + '\nDays     : ' + days + '\nKeySrc   : ' + usb + '\n';
    out.textContent += 'Sig      : 0x' + Array.from({length:32},()=>Math.floor(Math.random()*16).toString(16)).join('') + '\n';
    out.textContent += 'Merkle   : 0x' + Array.from({length:32},()=>Math.floor(Math.random()*16).toString(16)).join('') + '\n';
    out.textContent += '─────────────────────────\n✓ آماده ذخیره روی USB';
  }, 800);
};
