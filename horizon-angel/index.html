<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horizon Angel — Live Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma,sans-serif;background:#0a0e17;color:#eef2ff;min-height:100vh}
.banner{background:linear-gradient(135deg,#f59e0b,#3b82f6);color:#0a0e17;padding:8px;text-align:center;font-weight:700}
.header{text-align:center;padding:3rem 1rem 2rem}
.header h1{font-size:2.5rem;background:linear-gradient(135deg,#fff,#4f9eff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:#9bb2ff;margin-top:.5rem}
.badge{display:inline-block;background:#1e293b;color:#4f9eff;padding:4px 12px;border-radius:50px;font-size:12px;margin-top:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;max-width:1200px;margin:2rem auto 4rem;padding:0 1.5rem}
.card{background:#111827;border-radius:16px;padding:2rem;text-decoration:none;color:inherit;border:1px solid rgba(255,255,255,.08);transition:.3s}
.card:hover{transform:translateY(-4px);border-color:#4f9eff}
.card .icon{font-size:2rem;margin-bottom:1rem}
.card h3{margin-bottom:.5rem;color:#fff}
.card p{color:#94a3b8;font-size:.9rem}
.footer{text-align:center;padding:2rem;color:#6c7b9e;font-size:.85rem}
</style>
</head>
<body>
<div class="banner" id="banner" style="display:none">DEMO MODE — داده شبیه‌سازی‌شده</div>
<header class="header">
<h1>Horizon Angel</h1>
<p>پیش‌نمایش زنده Horizon Core</p>
<span class="badge" id="badge">...</span>
</header>
<main class="grid">
<a class="card" href="dashboard.html"><div class="icon">📊</div><h3>داشبورد</h3><p>نمای کلی سیستم</p></a>
<a class="card" href="sensors.html"><div class="icon">📡</div><h3>سنسورها</h3><p>پایش لحظه‌ای</p></a>
<a class="card" href="blocks.html"><div class="icon">⛓️</div><h3>کاوشگر بلاک</h3><p>مشاهده بلاک‌ها</p></a>
<a class="card" href="license.html"><div class="icon">🔑</div><h3>پنل مشتری</h3><p>مدیریت لایسنس</p></a>
<a class="card" href="admin.html"><div class="icon">⚙️</div><h3>پنل ادمین</h3><p>تنظیمات</p></a>
</main>
<footer class="footer">© 2026 Horizon Core</footer>
<script src="config.js"></script>
<script>
document.getElementById("badge").textContent = "حالت: " + CONFIG.MODE.toUpperCase();
if (CONFIG.DEMO_MODE) document.getElementById("banner").style.display = "block";
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
