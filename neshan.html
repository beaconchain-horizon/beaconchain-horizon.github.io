<title>Horizon Map | نقشه زیرساخت ایران</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma;background:#0a1628;color:#fff;height:100vh;overflow:hidden}
#map{position:absolute;inset:0;z-index:1}
#side{position:absolute;top:0;right:0;bottom:0;width:310px;background:rgba(10,22,40,.97);border-left:1px solid rgba(79,158,255,.3);z-index:100;overflow-y:auto;padding:15px}
#side h1{font-size:1.05rem;color:#4f9eff;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid rgba(79,158,255,.3)}
.cat{margin-bottom:10px;border-radius:10px;overflow:hidden;background:rgba(30,45,70,.5)}
.cat-h{padding:12px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#c084fc;transition:.2s;font-size:.9rem}
.cat-h:hover{background:rgba(79,158,255,.15)}
.cat-h .arrow{transition:.3s;font-size:.7rem}
.cat.open .cat-h .arrow{transform:rotate(-90deg)}
.cat-body{display:none;padding:8px}
.cat.open .cat-body{display:block}
.sub{padding:8px 12px;margin:4px 0;border-radius:6px;cursor:pointer;font-size:.78rem;color:#cbd5e1;background:rgba(20,32,55,.7);border-right:3px solid transparent;transition:.2s}
.sub:hover{background:rgba(79,158,255,.2);color:#fff}
.sub.active{background:linear-gradient(90deg,rgba(79,158,255,.3),transparent);border-right-color:#4f9eff;color:#fff;font-weight:700}
.sub .cnt{float:left;background:rgba(79,158,255,.3);padding:1px 7px;border-radius:10px;font-size:.65rem;color:#4f9eff;font-family:monospace}
.all-btn{width:100%;padding:10px;margin-bottom:15px;background:linear-gradient(135deg,#4f9eff,#c084fc);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-family:Tahoma;font-size:.85rem}
.all-btn:hover{opacity:.9}
.stats{position:absolute;bottom:15px;left:15px;background:rgba(10,22,40,.97);padding:15px 18px;border-radius:12px;border:1px solid rgba(79,158,255,.4);z-index:100;font-size:.78rem;direction:rtl}
.stats h3{color:#4f9eff;margin-bottom:8px;font-size:.88rem}
.stats .row{margin:5px 0;color:#8fa2dc}
.stats .row b{color:#4ade80;font-family:monospace;margin-right:6px;font-size:.95rem}
.maplibregl-popup-content{background:rgba(10,22,40,.98)!important;color:#fff!important;border:1px solid #4f9eff;border-radius:10px;padding:15px!important;font-family:Tahoma;direction:rtl;max-width:290px}
.maplibregl-popup-content h4{margin:0 0 8px;color:#4f9eff;font-size:.95rem;border-bottom:1px solid rgba(79,158,255,.3);padding-bottom:6px}
.maplibregl-popup-content ul{margin:5px 18px 0 0;padding:0;font-size:.75rem;color:#cbd5e1;line-height:1.8}
.maplibregl-popup-tip{border-top-color:rgba(10,22,40,.98)!important;border-bottom-color:rgba(10,22,40,.98)!important}
.legend-tip{position:absolute;top:15px;left:15px;background:rgba(10,22,40,.95);padding:10px 15px;border-radius:10px;border:1px solid rgba(79,158,255,.4);color:#8fa2dc;font-size:.75rem;z-index:99}
@media(max-width:700px){#side{width:250px}}
</style>

      {n:'بهمن موتور',c:[50.94,35.83]}
    ]},
    cement:{label:'سیمان', type:'point', color:'#0284c7', svc:'industry', items:[
      {n:'سیمان تهران',c:[51.42,35.55]},
      {n:'سیمان اصفهان',c:[51.66,32.65]},
      {n:'سیمان مشهد',c:[59.60,36.29]},
      {n:'سیمان تبریز',c:[46.29,38.08]},
      {n:'سیمان فارس',c:[52.58,29.59]},
      {n:'سیمان خوزستان',c:[48.67,31.32]}
    ]}
  }}
};

var maplibregl = window.maplibregl.default;
var map = new maplibregl.Map({container:'map',style:'https://static.neshan.org/sdk/maplibre/styles/light.json',center:[54.0,32.0],zoom:5,apiKey:'REDACTED_NESHAN_KEY'});
map.addControl(new maplibregl.NavigationControl(),'top-right');
map.addControl(new maplibregl.ScaleControl(),'bottom-left');
map.on('error',function(e){console.error('MAP:',e);});

var rendered = {};
var visible = {};

function makePopup(item, svcKey){
  var svc = SERVICES[svcKey] || [];
  var html = '<h4>'+item.n+'</h4>';
  if(svc.length){
    html += '<div style="font-size:.75rem;color:#8fa2dc;margin-bottom:5px">✅ خدمات قابل ارائه:</div><ul>';
    svc.forEach(function(s){ html += '<li>'+s+'</li>'; });
    html += '</ul>';
  }
  return html;
}

function renderAll(){
  Object.keys(DATA).forEach(function(catKey){
    var cat = DATA[catKey];
    Object.keys(cat.subs).forEach(function(subKey){
      var sub = cat.subs[subKey];
      var key = catKey+'.'+subKey;
      rendered[key] = {lines:[], markers:[]};
      visible[key] = true;
      sub.items.forEach(function(item){
        if(sub.type === 'line'){
          var id = catKey+'-'+subKey+'-'+Math.random().toString(36).slice(2,7);
          map.addSource(id, {type:'geojson', data:{type:'Feature', geometry:{type:'LineString', coordinates:item.c}}});
          map.addLayer({id:id, type:'line', source:id, paint:{'line-color':sub.color,'line-width':3,'line-opacity':.85}});
          (function(it){ map.on('click', id, function(e){ new maplibregl.Popup().setLngLat(e.lngLat).setHTML(makePopup(it, sub.svc)).addTo(map); }); })(item);
          map.on('mouseenter', id, function(){ map.getCanvas().style.cursor = 'pointer'; });
          map.on('mouseleave', id, function(){ map.getCanvas().style.cursor = ''; });
          rendered[key].lines.push(id);
        } else {
          var el = document.createElement('div');
          el.style.cssText = 'width:16px;height:16px;background:'+sub.color+';border:2px solid #fff;border-radius:50%;box-shadow:0 0 10px '+sub.color+';cursor:pointer';
          var m = new maplibregl.Marker({element:el}).setLngLat(item.c).addTo(map);
          m.setPopup(new maplibregl.Popup({offset:15}).setHTML(makePopup(item, sub.svc)));
          rendered[key].markers.push(m);
        }
      });
    });
  });
}

function setVisibility(fn){
  Object.keys(rendered).forEach(function(key){
    var show = fn(key);
    rendered[key].lines.forEach(function(id){ if(map.getLayer(id)) map.setLayoutProperty(id, 'visibility', show?'visible':'none'); });
    rendered[key].markers.forEach(function(m){ m.getElement().style.display = show ? 'block' : 'none'; });
  });
}

function countVisible(){
  var c = {gas:0, oil:0, power:0, bank:0, industry:0};
  Object.keys(rendered).forEach(function(key){
    if(visible[key]){
      var cat = key.split('.')[0];
      c[cat] = (c[cat]||0) + rendered[key].lines.length + rendered[key].markers.length;
    }
  });
  document.getElementById('s-gas').textContent = c.gas;
  document.getElementById('s-oil').textContent = c.oil;
  document.getElementById('s-power').textContent = c.power;
  document.getElementById('s-bank').textContent = c.bank;
  document.getElementById('s-ind').textContent = c.industry;
}

function buildSidebar(){
  var container = document.getElementById('cats');
  Object.keys(DATA).forEach(function(catKey){
    var cat = DATA[catKey];
    var div = document.createElement('div');
    div.className = 'cat';
    var header = document.createElement('div');
    header.className = 'cat-h';
    header.innerHTML = '<span>'+cat.label+'</span><span class="arrow">◀</span>';
    header.addEventListener('click', function(){ div.classList.toggle('open'); });
    div.appendChild(header);
    var body = document.createElement('div');
    body.className = 'cat-body';
    // Show all in category
    var allBtn = document.createElement('div');
    allBtn.className = 'sub';
    allBtn.style.background = 'linear-gradient(90deg,rgba(192,132,252,.25),transparent)';
    allBtn.style.color = '#c084fc';
    allBtn.style.fontWeight = '700';
    allBtn.textContent = '▶ نمایش همه در این دسته';
    allBtn.addEventListener('click', function(e){
      e.stopPropagation();
      document.querySelectorAll('.sub').forEach(function(s){ s.classList.remove('active'); });
      allBtn.classList.add('active');
      Object.keys(visible).forEach(function(vk){ visible[vk] = vk.split('.')[0] === catKey; });
      setVisibility(function(key){ return key.split('.')[0] === catKey; });
      countVisible();
    });
    body.appendChild(allBtn);
    // Sub items
    Object.keys(cat.subs).forEach(function(subKey){
      var sub = cat.subs[subKey];
      var subDiv = document.createElement('div');
      subDiv.className = 'sub';
      subDiv.innerHTML = sub.label + ' <span class="cnt">'+sub.items.length+'</span>';
      subDiv.addEventListener('click', function(e){
        e.stopPropagation();
        document.querySelectorAll('.sub').forEach(function(s){ s.classList.remove('active'); });
        subDiv.classList.add('active');
        var k = catKey+'.'+subKey;
        Object.keys(visible).forEach(function(vk){ visible[vk] = false; });
        visible[k] = true;
        setVisibility(function(key){ return key === k; });
        countVisible();
        // fit bounds
        var coords = [];
        sub.items.forEach(function(it){
          if(sub.type === 'line') coords = coords.concat(it.c);
          else coords.push(it.c);
        });
        if(coords.length){
          var lngs = coords.map(function(c){return c[0];});
          var lats = coords.map(function(c){return c[1];});
          map.fitBounds([[Math.min.apply(null,lngs), Math.min.apply(null,lats)], [Math.max.apply(null,lngs), Math.max.apply(null,lats)]], {padding:80, duration:800, maxZoom:10});
        }
      });
      body.appendChild(subDiv);
    });
    div.appendChild(body);
    container.appendChild(div);
  });
}

document.getElementById('showAll').addEventListener('click', function(){
  document.querySelectorAll('.sub').forEach(function(s){ s.classList.remove('active'); });
  Object.keys(visible).forEach(function(vk){ visible[vk] = true; });
  setVisibility(function(){ return true; });
  countVisible();
  map.flyTo({center:[54.0,32.0], zoom:5, duration:800});
});

map.on('load', function(){
  renderAll();
  buildSidebar();
  countVisible();
  console.log('MAP READY');
});
</script>
</body>
</html>
